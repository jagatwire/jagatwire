<script>
        // Simple radio button visual toggle logic for demonstration
        document.querySelectorAll('input[type="radio"][name="upi_app"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all
                document.querySelectorAll('input[type="radio"][name="upi_app"]').forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('border-2', 'border-primary');
                    label.classList.add('border', 'border-surface-variant');
                    const indicator = label.querySelector('.w-6.h-6');
                    indicator.classList.remove('border-primary', 'bg-primary');
                    indicator.classList.add('border-outline-variant', 'bg-transparent');
                    indicator.querySelector('div').classList.remove('bg-surface-container-lowest');
                    indicator.querySelector('div').classList.add('bg-transparent');
                });

                // Set active
                if(this.checked) {
                    const label = this.closest('label');
                    label.classList.remove('border', 'border-surface-variant');
                    label.classList.add('border-2', 'border-primary');
                    const indicator = label.querySelector('.w-6.h-6');
                    indicator.classList.remove('border-outline-variant', 'bg-transparent');
                    indicator.classList.add('border-primary', 'bg-primary');
                    indicator.querySelector('div').classList.remove('bg-transparent');
                    indicator.querySelector('div').classList.add('bg-surface-container-lowest');
                }
            });
        });
    </script>
