<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Title</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Function to toggle theme
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-theme');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            // Save the theme in localStorage
            const theme = body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            // Update icon
            themeToggleBtn.innerHTML = body.classList.contains('dark-theme') ? '🌞' : '🌙';
        }

        // Check for saved theme in localStorage and set it
        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                const body = document.body;
                body.classList.toggle('dark-theme', savedTheme === 'dark');
                const themeToggleBtn = document.getElementById('theme-toggle-btn');
                themeToggleBtn.innerHTML = savedTheme === 'dark' ? '🌞' : '🌙';
            }
        };
    </script>
</head>
<body>
    <header>
        <nav>
            <!-- Other header elements -->
            <button id="theme-toggle-btn" onclick="toggleTheme()">🌙</button> <!-- Dark mode toggle button -->
            <button class="profile-button">Profile</button>
            <!-- Other buttons -->
        </nav>
    </header>
    <main>
        <!-- Main content -->
    </main>
    <footer>
        <!-- Footer content -->
    </footer>
</body>
</html>
