<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JagatWire | Live Global News</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .header { text-align: center; padding: 30px; background: #1a73e8; color: white; border-radius: 12px; margin-bottom: 30px; }
        #news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; background-color: #ddd; }
        .content { padding: 15px; flex-grow: 1; }
        .title { font-size: 1.1rem; font-weight: bold; color: #1a73e8; text-decoration: none; display: block; margin-bottom: 10px; }
        .desc { font-size: 0.9rem; color: #555; line-height: 1.5; }
        .loading { text-align: center; font-size: 1.5rem; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>JagatWire News Portal 📰</h1>
        <p>Verified Live Headlines</p>
    </div>

    <div id="news-grid" class="loading">Loading the latest stories...</div>

    <script>
        const API_KEY = 'bf1b60294a75756aabaf0f52e4ba7412';

        async function fetchNews() {
            const grid = document.getElementById('news-grid');
            try {
                const response = await fetch(`https://gnews.io/api/v4/top-headlines?category=general&lang=en&apikey=${API_KEY}`);
                const data = await response.json();

                if (!data.articles) {
                    throw new Error(data.errors ? data.errors[0] : "Check API Key or Daily Limit");
                }

                grid.classList.remove('loading');
                grid.innerHTML = '';

                data.articles.forEach(article => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${article.image || 'https://via.placeholder.com/400x200?text=No+Image'}" alt="News">
                            <div class="content">
                                <a href="${article.url}" target="_blank" class="title">${article.title}</a>
                                <p class="desc">${article.description || 'Click to read the full story.'}</p>
                            </div>
                        </div>`;
                });
            } catch (error) {
                grid.innerHTML = `<p style="color:red; text-align:center;">Error: ${error.message}</p>`;
            }
        }

        fetchNews();
    </script>
</body>
</html>
