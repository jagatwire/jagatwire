<!DOCTYPE html>
<html>
<head>
    <title>JagatWire | Live News</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .news-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
    </style>
</head>
<body>
    <h1>JagatWire Live News</h1>
    <div id="news-container">Loading news...</div>

    <script>
        // PASTE YOUR KEY INSIDE THE QUOTES BELOW
        const API_KEY = 'PASTE_YOUR_NEWS_API_KEY_HERE'; 
        
        async function fetchNews() {
            try {
                const response = await fetch(`https://newsapi.org/v2/top-headlines?country=us&apiKey=${API_KEY}`);
                const data = await response.json();
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                
                data.articles.forEach(article => {
                    container.innerHTML += `
                        <div class="news-card">
                            <h3>${article.title}</h3>
                            <p>${article.description || ''}</p>
                            <a href="${article.url}" target="_blank">Read more</a>
                        </div>`;
                });
            } catch (error) {
                document.getElementById('news-container').innerHTML = "Error loading news. Check your API Key.";
            }
        }
        fetchNews();
    </script>
</body>
</html>
