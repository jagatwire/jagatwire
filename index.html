<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JagatWire | Global News Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: transform 0.3s; }
        .card:hover { transform: translateY(-8px); }
        .card img { width: 100%; height: 210px; object-fit: cover; background-color: #eee; }
        .content { padding: 20px; flex-grow: 1; }
        .title { font-size: 1.2rem; font-weight: bold; color: #1a73e8; text-decoration: none; line-height: 1.4; display: block; margin-bottom: 10px; }
        .desc { font-size: 0.95rem; color: #5f6368; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .footer { padding: 15px 20px; background: #fafafa; border-top: 1px solid #eee; font-size: 0.8rem; color: #70757a; }
        .loading { text-align: center; font-size: 1.5rem; margin-top: 100px; color: #1a73e8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>JagatWire News Portal 📰</h1>
        <p>Live global headlines delivered instantly</p>
    </div>

    <div id="news-grid" class="loading">Fetching latest stories...</div>

    <script>
        // Your Verified GNews API Key
        const API_KEY = 'bf1b60294a75756aabaf0f52e4ba7412';

        async function loadNews() {
            const grid = document.getElementById('news-grid');
            try {
                const response = await fetch(`https://gnews.io/api/v4/top-headlines?category=general&lang=en&apikey=${API_KEY}`);
                const data = await response.json();

                if (!data.articles || data.articles.length === 0) {
                    throw new Error("No articles found or API limit reached.");
                }

                grid.classList.remove('loading');
                grid.innerHTML = '';

                data.articles.forEach(article => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${article.image || 'https://via.placeholder.com/400x200?text=No+Image'}" alt="News">
                            <div class="content">
                                <a href="${article.url}" target="_blank" class="title">${article.title}</a>
                                <p class="desc">${article.description || 'Click to read the full story on the original website.'}</p>
                            </div>
                            <div class="footer">
                                Published: ${new Date(article.publishedAt).toLocaleDateString()}
                            </div>
                        </div>`;
                });
            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:red; padding:50px;">
                    <h3>Oops! Something went wrong.</h3>
                    <p>${err.message}</p>
                    <p>Make sure your email is verified on GNews.io</p>
                </div>`;
            }
        }

        loadNews();
    </script>
</body>
</html>
